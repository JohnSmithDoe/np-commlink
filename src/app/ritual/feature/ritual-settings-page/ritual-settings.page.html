<app-page-header
  icon="settings-outline"
  label="page-title.ritual-settings"
  hideButtons
/>

<ion-content class="ion-padding">
  <app-page-return />

  <ion-list lines="none">
    <ion-item>
      <ion-toggle
        data-testid="ritual-reminder-toggle"
        [checked]="reminder().enabled"
        (ionChange)="toggleReminder($event.detail.checked)"
      >
        {{ 'ritual.reminder.label' | translate }}
      </ion-toggle>
    </ion-item>

    @if (reminder().enabled) {
      <ion-item>
        <ion-input
          type="time"
          labelPlacement="start"
          data-testid="ritual-reminder-time"
          [label]="'ritual.reminder.time' | translate"
          [value]="reminderTime()"
          (ionChange)="setReminderTime($event.detail.value)"
        />
      </ion-item>
    }

    <ion-item>
      <ion-note>{{ 'ritual.reminder.hint' | translate }}</ion-note>
    </ion-item>
  </ion-list>

  <ion-list lines="none">
    <ion-item>
      <ion-label>
        {{ 'ritual.dismissed.label' | translate }}
        <ion-note>
          {{
            'ritual.dismissed.count' | translate: { count: dismissedCount() }
          }}
        </ion-note>
      </ion-label>
      <ion-button
        slot="end"
        fill="outline"
        size="small"
        data-testid="ritual-restore-dismissed"
        [disabled]="dismissedCount() === 0"
        (click)="restoreAll()"
      >
        {{ 'ritual.dismissed.restore' | translate }}
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
