<!-- The button is the only trigger — the input itself is visually hidden, so it
     needs no label of its own (a `<label for>` here would fire the file dialog a
     second time, which is what the old click/preventDefault pair suppressed). -->
<ion-button color="secondary" expand="block" (click)="fileInput.click()">
  {{ 'officetime.page.settings.barcode.button' | translate }}
</ion-button>
<input
  #fileInput
  id="image-input"
  type="file"
  accept="image/*"
  (change)="onFileSelected($event)"
/>
