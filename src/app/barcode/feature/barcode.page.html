<app-page-header
  icon="barcode-outline"
  [label]="'page-title.barcode' | translate"
  hideButtons="true"
/>

<ion-content>
  @let barcodeUrl = barcode();
  @if (barcodeUrl) {
    <img [src]="barcodeUrl" alt="Barcode" class="barcode" />
    <ion-item>
      <ion-button (click)="deleteBarcode()" color="danger" size="small"
        >{{ 'officetime.page.settings.barcode.delete' | translate }}
      </ion-button>
      <ion-button (click)="rotateBarcode()" color="secondary" size="small"
        >{{ 'officetime.page.settings.barcode.rotate' | translate }}
      </ion-button>
    </ion-item>
  } @else {
    <ion-list>
      <ion-item>
        <app-barcode-input />
      </ion-item>
    </ion-list>
  }
</ion-content>
