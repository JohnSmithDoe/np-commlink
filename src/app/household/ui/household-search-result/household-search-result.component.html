@for (item of results()?.products ?? []; track item.id) {
  <app-text-item
    [label]="item.name"
    [note]="item | categories: catalog()"
    [helper]="'household.list-header.product.search' | translate"
    (selectItem)="selectProduct.emit(item)"
  ></app-text-item>
}
@for (item of results()?.shoppingItems ?? []; track item.id) {
  <app-text-item
    [label]="item.name"
    [note]="item | categories: catalog()"
    [helper]="'household.list-header.shopping.search' | translate"
    (selectItem)="selectShoppingItem.emit(item)"
  ></app-text-item>
}
@for (item of results()?.storageItems ?? []; track item.id) {
  <app-text-item
    [label]="item.name"
    [note]="item | categories: catalog()"
    [helper]="'household.list-header.storage.search' | translate"
    (selectItem)="selectStorageItem.emit(item)"
  ></app-text-item>
}
