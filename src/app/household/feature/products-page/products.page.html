<app-list-page
  class="ion-page"
  pageHeader="page-title.household-products"
  icon="pricetags-outline"
  [itemTemplate]="productItem"
>
  <app-item-list-quick-add beforeList />
  <app-household-search-panel beforeList />
  <app-household-list-settings-button toolbarActionsEnd />
</app-list-page>

<ng-template
  #productItem
  let-item
  let-ionList="ionList"
  let-categories="categories"
>
  <app-list-item
    [item]="item"
    [title]="item.name"
    [ionList]="ionList"
    [categories]="categories"
    (selectItem)="showEditDialog(item)"
    (deleteItem)="removeItem(item)"
  ></app-list-item>
</ng-template>

<app-edit-product-dialog />
