<app-list-page
  class="ion-page"
  pageHeader="page-title.household-products"
  [itemTemplate]="productItem"
>
  <app-item-list-quick-add beforeList />
  <app-household-search-panel beforeList />
  <app-settings-link-button
    route="/household/list-settings"
    toolbarActionsEnd
    [label]="listSettingsLabel"
  />
</app-list-page>

<ng-template
  #productItem
  let-item
  let-ionList="ionList"
  let-categories="categories"
>
  <app-list-item
    [item]="item"
    [title]="item.name"
    [ionList]="ionList"
    [categories]="categories"
    (selectItem)="showEditDialog(item)"
    (deletionRequested)="removeItem(item)"
  />
</ng-template>

<app-edit-product-dialog />
