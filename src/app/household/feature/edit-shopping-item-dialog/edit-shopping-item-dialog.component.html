<app-item-edit-modal
  [nameField]="form.name"
  [canSave]="canSave()"
  [isOpen]="isOpen()"
  [saveButtonText]="saveButtonText()"
  [dialogTitle]="dialogTitle()"
  [closeButtonText]="closeButtonText"
  (confirmed)="confirm()"
  (cancelled)="close()"
  (dismissed)="close()"
>
  <app-category-input
    [categories]="selectedCategories()"
    (removeCategory)="removeCategory($event)"
    (openDialog)="openCategoriesDialog()"
  />

  <app-number-input
    [label]="'household.item.quantity' | translate"
    [value]="draft().quantity"
    (updateValue)="setQuantity($event)"
  />

  <app-categories-dialog
    [isOpen]="categoriesDialogOpen()"
    [categories]="categories()"
    [selection]="draft().categoryIds ?? []"
    (confirmed)="confirmCategories($event)"
    (cancelled)="cancelCategories()"
    (dismissed)="cancelCategories()"
    (addNew)="addCategory($event)"
    (deleted)="deleteCategory($event)"
    (renamed)="renameCategory($event)"
  />
</app-item-edit-modal>
