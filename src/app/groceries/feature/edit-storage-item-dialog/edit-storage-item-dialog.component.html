<app-item-edit-modal
  [nameField]="form.name"
  [canSave]="canSave()"
  [isOpen]="isOpen()"
  [saveButtonText]="saveButtonText()"
  [dialogTitle]="dialogTitle()"
  closeButtonText="edit.item.dialog.button.close"
  (confirmed)="confirm()"
  (cancelled)="close()"
  (dismissed)="close()"
>
  <app-number-input
    [label]="'grocery.item.min-amount' | translate"
    [value]="draft().minAmount ?? undefined"
    (updateValue)="updateMinAmount($event)"
  ></app-number-input>

  <app-date-input
    [label]="'edit.item.dialog.mhd' | translate"
    [value]="draft().bestBefore ?? null"
    (valueChange)="updateBestBefore($event)"
  ></app-date-input>

  <app-category-input
    [categories]="selectedCategories()"
    (removeCategory)="removeCategory($event)"
    (openDialog)="openCategoriesDialog()"
  ></app-category-input>

  <app-categories-dialog
    [isOpen]="categoriesDialogOpen()"
    [categories]="categories()"
    [selection]="draft().categoryIds ?? []"
    (confirmed)="confirmCategories($event)"
    (cancelled)="cancelCategories()"
    (dismissed)="cancelCategories()"
    (addNew)="addCategory($event)"
    (deleted)="deleteCategory($event)"
    (renamed)="renameCategory($event)"
  ></app-categories-dialog>
</app-item-edit-modal>
