<app-item-edit-modal
  [item]="seedItem()"
  [listItems]="listItems()"
  [isOpen]="isOpen()"
  [saveButtonText]="saveButtonText()"
  [dialogTitle]="dialogTitle()"
  closeButtonText="grocery.edit-item.dialog.button.close"
  (nameChange)="updateName($event)"
  (confirmed)="confirm()"
  (cancelled)="close()"
  (dismissed)="close()"
>
  <app-number-input
    [label]="'grocery.item.quantity' | translate"
    [value]="draft()?.quantity ?? 1"
    (updateValue)="updateQuantity($event)"
  ></app-number-input>

  <app-category-input
    [categories]="selectedCategories()"
    (removeCategory)="removeCategory($event)"
    (openDialog)="openCategoriesDialog()"
  ></app-category-input>

  <app-categories-dialog
    [isOpen]="categoriesDialogOpen()"
    [categories]="categories()"
    [selection]="draft()?.categoryIds ?? []"
    (confirmed)="confirmCategories($event)"
    (cancelled)="cancelCategories()"
    (dismissed)="cancelCategories()"
    (addNew)="addCategory($event)"
    (deleted)="deleteCategory($event)"
    (renamed)="renameCategory($event)"
  ></app-categories-dialog>
</app-item-edit-modal>
