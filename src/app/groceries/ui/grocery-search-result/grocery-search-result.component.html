<!--  product search result-->
@if (results()?.products?.length) {
  <app-item-list
    header="{{ 'grocery.list-header.product.search' | translate }}"
    [listHeader]="true"
    [items]="results()?.products ?? []"
    [itemTemplate]="productItem"
  ></app-item-list>
  <ng-template #productItem let-item>
    <app-text-item
      [label]="item.name"
      [note]="item | appCategories"
      [helper]="'grocery.item-helper.search' | translate"
      (selectItem)="selectProduct.emit(item)"
    ></app-text-item>
  </ng-template>
}
