<app-list-page
  class="ion-page"
  pageHeader="{{ 'grocery.page-title.tasks' | translate }}"
  listHeader="{{ 'grocery.list-header.tasks' | translate }}"
  [itemTemplate]="taskItem"
>
  <ng-container toolbarActions>
    <ion-button (click)="setSortMode('prio')">{{
      'grocery.list-toolbar.prio' | translate
    }}</ion-button>
    <ion-button (click)="setSortMode('dueAt')">{{
      'grocery.list-toolbar.due' | translate
    }}</ion-button>
  </ng-container>
</app-list-page>

<ng-template #taskItem let-item let-ionList="ionList">
  <app-list-item
    [item]="item"
    [title]="item.name"
    [ionList]="ionList"
    [statusColor]="getItemStatusColor(item)"
    (selectItem)="showEditDialog(item)"
    (deleteItem)="removeItem(item)"
  >
    @if (item.dueAt) {
      <ng-container itemDetails>
        <ion-note>
          {{ 'grocery.item.due.note' | translate }}:
          {{ item.dueAt | date: undefined : undefined : 'de-DE' }}
        </ion-note>
        <br />
      </ng-container>
    }

    @if (item.prio) {
      <ng-container itemDetails>
        <ion-note>
          {{ 'grocery.item.prio' | translate }}:
          {{ item.prio }}
        </ion-note>
        <br />
      </ng-container>
    }
  </app-list-item>
</ng-template>

<app-edit-task-item-dialog></app-edit-task-item-dialog>
