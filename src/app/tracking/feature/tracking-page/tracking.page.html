<app-list-page
  class="ion-page"
  pageHeader="page-title.tracking"
  [itemTemplate]="trackingItem"
>
  <ion-button
    headerEnd
    slot="end"
    fill="clear"
    routerLink="/data"
    data-testid="tracking-daily-view-link"
    [attr.aria-label]="'tracking.a11y.daily-view' | translate"
  >
    <ion-icon
      slot="icon-only"
      name="settings-outline"
      color="primary"
      aria-hidden="true"
    />
  </ion-button>

  <ng-container toolbarActionsEnd>
    <span class="tracking-total">{{ total() }}</span>
    @if (items().length) {
      <ion-button (click)="resetAll()"
        ><ion-icon slot="start" aria-hidden="true" name="trash-outline" />
        {{ 'tracking.action.reset-all' | translate }}</ion-button
      >
      <ion-button (click)="saveAndResetAll()"
        ><ion-icon slot="start" aria-hidden="true" name="save-outline" />
        {{ 'tracking.action.save-and-reset' | translate }}</ion-button
      >
    }
    @if (isDev) {
      <ion-button color="warning" (click)="seedDemoSessions()"
        ><ion-icon slot="start" aria-hidden="true" name="flask-outline" />
        {{ 'tracking.action.generate-dummy-data' | translate }}</ion-button
      >
      <ion-button color="warning" (click)="generateTaskByTicket()"
        ><ion-icon slot="start" aria-hidden="true" name="flask-outline" />
        {{ 'tracking.action.generate-task-by-ticket' | translate }}</ion-button
      >
    }
  </ng-container>

  <div afterList class="after-list">
    <app-daily-sessions />
  </div>
</app-list-page>

<ng-template #trackingItem let-item let-ionList="ionList">
  <app-tracking-item
    [item]="item"
    [ionList]="ionList"
    (editItem)="showEditDialog(item)"
    (resetItem)="resetItem(item)"
    (selectItem)="toggleTracking(item)"
    (deleteItem)="removeItem(item)"
  />
</ng-template>

<app-edit-tracking-item-dialog />
