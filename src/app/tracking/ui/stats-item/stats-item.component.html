<ng-template #itemTemplate>
  <ion-item lines="full">
    <ion-label class="ion-text-wrap">
      <h2>{{ item().name }}</h2>
      <ion-note>
        {{
          'tracking.item.start'
            | translate: { time: item() | timeFromDataItem: view() }
        }}
      </ion-note>
    </ion-label>
    <ion-label slot="end">
      {{ item() | trackingTime }}
    </ion-label>
  </ion-item>
</ng-template>

<ion-item-sliding (ionDrag)="onSwipe($event)">
  <ng-container *ngTemplateOutlet="itemTemplate" />

  @if (canDelete()) {
    <ion-item-options side="end">
      <ion-item-option
        color="danger"
        [expandable]="true"
        (click)="emitDeleteItem()"
      >
        {{ 'tracking.item.action.delete' | translate }}
      </ion-item-option>
    </ion-item-options>
  }
</ion-item-sliding>
