<ion-app class="">
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>commlink</ion-title>
        <!-- Permanent, and deliberately not one of the entries below: SYSOP is
             hideable like everything else, so without this the user could hide
             the only door back to the page that un-hides it. -->
        <ion-buttons slot="end">
          <ion-menu-toggle>
            <ion-button
              routerLink="/settings"
              [attr.aria-label]="'page-title.settings' | translate"
            >
              <ion-icon slot="icon-only" name="settings-outline" />
            </ion-button>
          </ion-menu-toggle>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <main>
        <ion-list>
          @for (entry of menuEntries(); track entry.id) {
            <ion-menu-toggle>
              <ion-item [button]="true" [routerLink]="entry.route" lines="none">
                <ion-icon slot="start" [name]="entry.icon" />
                <ion-label>{{ entry.titleKey | translate }}</ion-label>
                @let badge = menuBadge(entry);
                @if (badge > 0) {
                  <ion-badge slot="end" color="danger">{{ badge }}</ion-badge>
                }
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </main>
    </ion-content>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
