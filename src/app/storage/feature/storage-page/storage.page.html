<app-grocery-list-page
  class="ion-page"
  listId="_storage"
  pageHeader="{{ 'grocery.page-title.storage' | translate }}"
  listHeader="{{ 'grocery.list-header.storage' | translate }}"
  [itemTemplate]="storageItem"
>
  <ion-button (click)="setSortMode('bestBefore')" toolbarActions
    >{{ 'grocery.list-toolbar.mhd' | translate }}</ion-button
  >
  @if (showScanButton) {
    <ion-button (click)="scan()" toolbarActions>
      <ion-icon slot="icon-only" name="barcode-outline" />
    </ion-button>
  }
</app-grocery-list-page>

<ng-template #storageItem let-item let-ionList="ionList">
  <app-list-item
    [item]="item"
    [title]="item.quantity + ' x ' + item.name"
    [ionList]="ionList"
    [statusColor]="getItemStatusColor(item)"
    [showQuantityActions]="true"
    [showCartAction]="true"
    (selectItem)="showEditDialog(item)"
    (deleteItem)="removeItem(item)"
    (increment)="changeQuantity(item, +1)"
    (decrement)="changeQuantity(item, -1)"
    (cartItem)="copyToShoppingList(item)"
  >
    @if (item.bestBefore) {
      <ion-note itemDetails>
        {{ 'grocery.item.best-before.note' | translate }}:
        {{ item.bestBefore | date: undefined : undefined : 'de-DE' }}
      </ion-note>
      <br itemDetails />
    }

    @if (item.minAmount) {
      <ion-note itemDetails>
        {{ 'grocery.item.min-amount' | translate }}: {{ item.minAmount }}
      </ion-note>
    }
  </app-list-item>
</ng-template>

<app-edit-storage-item-dialog></app-edit-storage-item-dialog>
<app-edit-global-item-dialog></app-edit-global-item-dialog>
