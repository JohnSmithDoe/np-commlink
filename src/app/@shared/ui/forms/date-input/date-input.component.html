<ion-item>
  <ion-input
    labelPlacement="stacked"
    class="trigger"
    type="text"
    [readonly]="true"
    [id]="triggerId"
    [label]="label()"
    [disabled]="disabled()"
    [value]="value() | date"
  />
  <ion-modal
    [trigger]="triggerId"
    [attr.aria-label]="'a11y.date-picker' | translate"
    [initialBreakpoint]="0.65"
  >
    <ng-template>
      <ion-datetime
        presentation="date"
        mode="md"
        [locale]="locale"
        [firstDayOfWeek]="1"
        [value]="value()"
        [showDefaultButtons]="true"
        [showClearButton]="true"
        [cancelText]="'date-picker.cancel' | translate"
        [clearText]="'date-picker.clear' | translate"
        [doneText]="'date-picker.done' | translate"
        (ionChange)="updateInputValue($event)"
      />
    </ng-template>
  </ion-modal>
</ion-item>
