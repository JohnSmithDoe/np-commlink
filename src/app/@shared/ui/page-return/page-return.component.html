@if (target(); as parent) {
  <a class="sr-return" data-testid="page-return" [routerLink]="parent.route">
    <ion-icon
      class="sr-return__icon"
      name="chevron-back-outline"
      aria-hidden="true"
    />
    <span class="sr-return__name">{{
      'nav.return' | translate: { name: parent.titleKey | translate }
    }}</span>
  </a>
}
