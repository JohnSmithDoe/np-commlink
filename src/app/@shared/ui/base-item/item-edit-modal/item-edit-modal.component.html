<ion-modal
  [isOpen]="isOpen()"
  (didDismiss)="dismissed.emit()"
  [attr.aria-label]="dialogTitle() | translate"
>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancelled.emit()"
            >{{ closeButtonText() | translate }}
          </ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
          <ion-button (click)="confirmed.emit()" [disabled]="!canSave()">{{
            saveButtonText() | translate
          }}</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <h3 class="ion-padding-start">{{ dialogTitle() | translate }}</h3>
      <ion-list>
        <app-item-name-input [formField]="nameField()" />
        <ng-content></ng-content>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
