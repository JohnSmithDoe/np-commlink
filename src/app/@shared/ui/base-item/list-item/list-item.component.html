<ion-item-sliding (ionDrag)="deleteOrCartOnSwipe($event)">
  @if (showCartAction()) {
    <ion-item-options side="start">
      <ion-item-option
        color="success"
        [expandable]="true"
        (click)="emitCartItem()"
      >
        <ion-icon name="cart" slot="icon-only"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  }

  <ion-item
    [button]="true"
    (click)="selectItem.emit()"
    lines="full"
    [class.with-status]="hasStatusBar()"
  >
    @if (hasStatusBar()) {
      <div class="status-bar">
        <ion-text [color]="statusColor()"></ion-text>
      </div>
    }

    <ion-reorder slot="start"></ion-reorder>
    <ion-label class="ion-text-wrap" [class.bought]="crossedOut()">
      <h2>{{ title() }}</h2>
      <ion-note
        [appCategoryNote]="item()"
        [appCategoryNoteCatalog]="categories()"
      ></ion-note>
      <ng-content select="[itemDetails]"></ng-content>
    </ion-label>

    @if (showQuantityActions()) {
      <ion-buttons slot="end">
        <ion-button
          (click)="incrementQuantity($event)"
          [attr.aria-label]="'a11y.increase-quantity' | translate"
        >
          <ion-icon name="add" aria-hidden="true"></ion-icon>
        </ion-button>
        <ion-button
          (click)="decrementQuantity($event)"
          [attr.aria-label]="'a11y.decrease-quantity' | translate"
        >
          <ion-icon name="remove" aria-hidden="true"></ion-icon>
        </ion-button>
      </ion-buttons>
    }
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option
      color="danger"
      [expandable]="true"
      (click)="emitDeleteItem()"
    >
      {{ 'item-list.action.delete' | translate }}
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
