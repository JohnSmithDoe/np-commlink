<app-page-header
  [color]="color()"
  [icon]="icon()"
  [label]="pageHeader()"
  [disabled]="!!facade.searchResult()?.exactMatch"
  (addItem)="showCreateDialog()"
>
  <app-item-list-searchbar
    [query]="facade.state()?.searchQuery"
    (queryChange)="search($event)"
    (hitEnter)="addItemFromSearch()"
  />
  <app-item-list-toolbar
    [showDisplayMode]="hasCategories()"
    (selectDisplayMode)="setDisplayMode($event)"
    (selectSortMode)="setSortMode($event)"
  >
    <ng-content select="[toolbarActions]" />
    <ng-content select="[toolbarActionsEnd]" toolbarActionsEnd />
    @if (hasCategories()) {
      <ion-button
        toolbarActionsEnd
        (click)="manageCategories()"
        [attr.aria-label]="'grocery.a11y.manage-categories' | translate"
      >
        <ion-icon slot="icon-only" name="pricetags-outline" />
      </ion-button>
    }
  </app-item-list-toolbar>

  <ng-content select="[headerEnd]" toolbar></ng-content>
</app-page-header>

<ion-content>
  <!-- Grocery-only quick-add row, projected by the grocery pages; tracking and
       tasks project nothing here. -->
  <ng-content select="[quickAdd]"></ng-content>

  <app-item-list
    [headerColor]="
      facade.filter().isCategoryModeOrHasFilter === true ? 'primary' : color()
    "
    [header]="
      facade.filter().isCategoryModeOrHasFilter === true
        ? facade.filter().hasFilter === true
          ? ('grocery.list-header.category.filter'
            | translate: { category: filterName() })
          : ('grocery.list-header.category' | translate)
        : listHeader()
    "
    [mode]="facade.state()?.mode ?? 'alphabetical'"
    [items]="facade.items()"
    [categories]="facade.categories()"
    [catalog]="facade.state()?.categories ?? []"
    [itemTemplate]="itemTemplate()"
    (selectCategory)="selectCategory($event)"
    (deleteCategory)="deleteCategory($event)"
  >
    <ng-content select="[listActions]"></ng-content>
  </app-item-list>
  @if (facade.state()?.mode === 'categories') {
    <app-item-list-empty
      [isEmptyList]="!facade.categories().length"
      [isSearching]="!!facade.state()?.searchQuery"
      [searchTerm]="facade.state()?.searchQuery"
      (emptyList)="showCreateDialog()"
      (emptySearch)="addCategoryFromSearch()"
    />
  } @else {
    <app-item-list-empty
      [isEmptyList]="!facade.items()?.length"
      [isSearching]="facade.searchResult()?.hasSearchTerm"
      [searchTerm]="facade.searchResult()?.searchTerm"
      (emptyList)="showCreateDialog()"
      (emptySearch)="addItemFromSearch()"
    />
  }

  <ng-content select="[searchExtras]"></ng-content>
</ion-content>

@if (hasCategories()) {
  <app-category-name-dialog
    [isOpen]="categoryDialog() !== null"
    [name]="categoryDialog() ?? ''"
    (confirmed)="saveCategory($event)"
    (cancelled)="categoryDialog.set(null)"
  />
}
