@boundary {
  <ion-tabs>
    <ion-tab-bar
      slot="bottom"
      data-testid="module-tabs"
      [attr.aria-label]="'nav.a11y.tabs' | translate"
    >
      @for (tab of tabs; track tab.id) {
        <ion-tab-button
          [tab]="tab.segment"
          [attr.aria-label]="tab.titleKey | translate"
        >
          <ion-icon aria-hidden="true" [name]="tab.icon" />
        </ion-tab-button>
      }
    </ion-tab-bar>
  </ion-tabs>
} @error {
  <app-error-fallback [reason]="$error.message" (retry)="$reset()" />
}
