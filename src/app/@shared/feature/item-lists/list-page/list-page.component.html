<app-page-header
  [icon]="icon()"
  [label]="pageHeader()"
  [heading]="heading()"
  [disabled]="!!facade.searchResult()?.exactMatch"
  (addItem)="facade.showCreateDialog()"
>
  <ion-buttons toolbar slot="end">
    <app-undo-button />
  </ion-buttons>

  @if (facade.searchable?.() ?? true) {
    <app-item-list-searchbar
      [query]="facade.state()?.searchQuery"
      (queryChange)="facade.search($event)"
      (hitEnter)="facade.addItemFromSearch()"
    />
  }
  @if (facade.searchResult()?.exactMatch) {
    <ion-note
      class="sr-field-note exact-match-note"
      data-testid="exact-match-note"
    >
      {{ 'item-list.exact-match.note' | translate }}
    </ion-note>
  }
  @if (facade.hasToolbar?.() ?? true) {
    <app-item-list-toolbar
      [activeSort]="facade.state()?.sort"
      [options]="facade.sortOptions?.() ?? []"
      [sortable]="facade.sortable?.() ?? true"
      (selectSortMode)="facade.setSortMode($event)"
    >
      <ng-content select="[toolbarActions]" />
      <ng-content select="[toolbarActionsEnd]" toolbarActionsEnd />
      @if (canManageCategories) {
        <ion-button
          toolbarActionsEnd
          (click)="manageCategories()"
          [attr.aria-label]="'categories.a11y.manage' | translate"
        >
          <ion-icon
            slot="icon-only"
            name="pricetags-outline"
            aria-hidden="true"
          />
        </ion-button>
      }
    </app-item-list-toolbar>
  }
  @if (facade.catalog?.()?.length) {
    <app-category-filter-bar
      [catalog]="facade.catalog?.() ?? []"
      [extraFilters]="extraFilters()"
      [active]="facade.state()?.filterBy"
      (selectCategory)="facade.selectCategory?.($event)"
      (clearFilter)="clearFilter()"
    />
  }

  <ng-content select="[headerEnd]" toolbar></ng-content>
</app-page-header>

<ion-content>
  <app-page-return [route]="returnRoute()" [label]="returnLabel()" />

  <ng-content select="[beforeList]"></ng-content>

  @for (section of sections(); track section.id) {
    <app-item-list
      [items]="section.items"
      [header]="
        showSectionHeaders() && section.labelKey
          ? (section.labelKey | translate)
          : ''
      "
      listHeader
      [catalog]="facade.catalog?.() ?? []"
      [itemTemplate]="itemTemplate()"
      [reorderable]="reorderArmed()"
      (reorder)="facade.reorder?.($event, section.id)"
    />
  }
  <ion-infinite-scroll
    [disabled]="hiddenCount() === 0"
    (ionInfinite)="showMore($event)"
  >
    <ion-infinite-scroll-content />
  </ion-infinite-scroll>
  <app-item-list-empty
    [isEmptyList]="isKnownEmpty()"
    [isSearchable]="facade.searchable?.() ?? true"
    [isSearching]="!!facade.searchResult()"
    [isFiltered]="!!facade.state()?.filterBy"
    [searchTerm]="facade.searchResult()?.searchTerm"
    (emptyList)="facade.showCreateDialog()"
    (emptySearch)="facade.addItemFromSearch()"
    (clearFilter)="clearFilter()"
  />

  <ng-content select="[afterList]"></ng-content>
</ion-content>
