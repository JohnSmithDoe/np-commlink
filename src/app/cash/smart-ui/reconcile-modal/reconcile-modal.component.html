<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">
        {{ 'cash.action.cancel' | translate }}
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'cash.reconcile.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-note class="cash-reconcile__hint">
    {{ 'cash.reconcile.hint' | translate }}
  </ion-note>

  @if (candidates().length) {
    <ion-list lines="full">
      @for (txn of candidates(); track txn.id) {
        <ion-item button detail="true" (click)="reconcileWith(txn)">
          <ion-label>
            <h2>{{ txn.name }}</h2>
            <p>{{ txn.dateISO | localizedDate }}</p>
          </ion-label>
          <ion-note
            slot="end"
            class="cash-txn__amount"
            [class.cash-txn__amount--out]="txn.amountCents < 0"
            [class.cash-txn__amount--in]="txn.amountCents > 0"
          >
            {{ txn.amountCents | moneyEur }}
          </ion-note>
        </ion-item>
      }
    </ion-list>
  } @else {
    <app-empty-state [label]="'cash.reconcile.empty' | translate" />
  }
</ion-content>
