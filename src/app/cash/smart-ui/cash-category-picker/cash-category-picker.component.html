<app-category-input
  [categories]="selectedCategories()"
  (categoryRemoved)="clear()"
  (openDialog)="open()"
/>

<app-categories-dialog
  [multiple]="false"
  [isOpen]="dialogOpen()"
  [categories]="categories()"
  [selection]="value() ? [value()] : []"
  (confirmed)="pick($event)"
  (cancelled)="close()"
  (dismissed)="close()"
  (categoryCreated)="onAdd($event)"
  (deleted)="onDelete($event)"
  (renamed)="onRename($event)"
/>
