<ion-button fill="outline" size="small" (click)="fileInput.click()">
  <ion-icon slot="start" name="image-outline" aria-hidden="true" />
  {{ 'notes.editor.add-image' | translate }}
</ion-button>
<input
  #fileInput
  class="note-image-file"
  type="file"
  accept="image/*"
  [attr.aria-label]="'notes.editor.add-image' | translate"
  (change)="onFileSelected($event)"
/>
