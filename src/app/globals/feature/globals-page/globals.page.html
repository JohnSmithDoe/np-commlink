<app-grocery-list-page
  class="ion-page"
  listId="_globals"
  pageHeader="{{ 'grocery.page-title.globals' | translate }}"
  listHeader="{{ 'grocery.list-header.globals' | translate }}"
  [itemTemplate]="globalItem"
>
</app-grocery-list-page>

<ng-template #globalItem let-item let-ionList="ionList">
  <app-list-item
    [item]="item"
    [title]="item.name"
    [ionList]="ionList"
    (selectItem)="showEditDialog(item)"
    (deleteItem)="removeItem(item)"
  ></app-list-item>
</ng-template>

<app-edit-global-item-dialog></app-edit-global-item-dialog>
