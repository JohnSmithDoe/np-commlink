<app-list-page
  class="ion-page"
  [heading]="facade.heading()"
  [itemTemplate]="gameRow"
>
  <ion-button
    headerEnd
    slot="end"
    (click)="facade.showEditPlayerDialog()"
    color="primary"
    [attr.aria-label]="'a11y.edit' | translate"
  >
    <ion-icon slot="icon-only" name="create-outline" aria-hidden="true" />
  </ion-button>

  <ion-button
    toolbarActions
    (click)="facade.toggleShowEnded()"
    [attr.aria-pressed]="facade.showEndedGames()"
    [attr.aria-label]="'trackplay.settings.show-ended' | translate"
    data-testid="games-show-ended"
  >
    <ion-icon
      slot="icon-only"
      [name]="facade.showEndedGames() ? 'eye' : 'eye-off'"
      aria-hidden="true"
    />
  </ion-button>

  <div beforeList class="ion-padding tp-player-stats">
    @let stats = facade.stats();
    <p class="sr-hud">
      {{
        'trackplay.stats.win-loss-open'
          | translate: { win: stats.win, loss: stats.loss, open: stats.open }
      }}
    </p>
    <p class="sr-hud">
      {{ 'trackplay.stats.play' | translate: { count: stats.play } }}
    </p>
  </div>
</app-list-page>

<ng-template
  #gameRow
  let-item
  let-ionList="ionList"
  let-categories="categories"
>
  <app-trackplay-game-row
    [item]="item"
    [ionList]="ionList"
    [categories]="categories"
    (selectGame)="goToGame(item.id)"
    (editGame)="openGameEdit(item)"
    (deleteGame)="deleteGame(item)"
  />
</ng-template>

<app-edit-player-dialog />
<app-edit-game-dialog />
