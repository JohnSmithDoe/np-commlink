@if (roll(); as roll) {
  <div class="dice-tray" [class.dice-tray--rolling]="!revealed()">
    <div class="dice-tray__dice">
      @for (die of dice(); track $index) {
        <app-trackplay-die-glyph
          class="dice-tray__die"
          [style.--dice-settle]="die.settle"
          [faces]="die.faces"
          [value]="die.value"
        />
      }
    </div>

    <p
      class="dice-tray__total"
      role="status"
      data-testid="dice-total"
      [class.dice-tray__total--settled]="revealed()"
    >
      @if (revealed()) {
        {{ roll.total }}
      }
    </p>
  </div>
}
