<ion-list lines="full">
  @for (player of orderedPlayers(); track player.id) {
    <ion-item data-testid="player-select-row">
      <ion-checkbox
        justify="start"
        labelPlacement="end"
        data-testid="player-select-checkbox"
        [checked]="isChecked(player.id)"
        (ionChange)="onToggle(player.id, $event)"
        >{{ player.name }}</ion-checkbox
      >
    </ion-item>
  }
</ion-list>
