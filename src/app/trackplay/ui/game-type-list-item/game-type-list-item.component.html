<ion-item-sliding (ionDrag)="deleteOrEditOnSwipe($event)">
  @if (canDelete()) {
    <ion-item-options side="start">
      <ion-item-option
        color="danger"
        [expandable]="true"
        (click)="emitDelete()"
      >
        <ion-icon slot="start" name="trash" aria-hidden="true" />
        {{ 'trackplay.action.delete' | translate }}
      </ion-item-option>
    </ion-item-options>
  }

  <ion-item [button]="true" lines="full" (click)="selectType.emit()">
    <ion-icon slot="start" name="dice" aria-hidden="true" />
    <ion-label class="ion-text-wrap">
      <h2>{{ gameType().name }}</h2>
      <p>
        {{
          (gameType().winHigh
            ? 'trackplay.gametype.win-high'
            : 'trackplay.gametype.win-low'
          ) | translate
        }}
      </p>
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option [expandable]="true" (click)="emitEdit()">
      <ion-icon slot="start" name="create" aria-hidden="true" />
      {{ 'trackplay.action.edit' | translate }}
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
