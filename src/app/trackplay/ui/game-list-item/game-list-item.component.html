<ion-item-sliding (ionDrag)="deleteOrEditOnSwipe($event)">
  <ion-item-options side="start">
    <ion-item-option color="danger" [expandable]="true" (click)="emitDelete()">
      <ion-icon slot="start" name="trash" aria-hidden="true" />
      {{ 'trackplay.action.delete' | translate }}
    </ion-item-option>
  </ion-item-options>

  <ion-item
    [button]="true"
    [disabled]="disabled()"
    lines="full"
    (click)="selectGame.emit()"
  >
    <ion-icon slot="start" name="play-circle" aria-hidden="true" />
    <ion-label class="ion-text-wrap">
      <h2>{{ game().name }}</h2>
      <p class="second-line">
        <ion-text color="medium">{{ typeName() }}</ion-text>
        <span class="value">{{ game().created | date: 'short' }}</span>
      </p>
      <p class="second-line">
        <ion-text color="medium">{{
          'trackplay.label.last-played' | translate
        }}</ion-text>
        <span class="value">{{ game().updated | date: 'short' }}</span>
      </p>
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option [expandable]="true" (click)="emitEdit()">
      <ion-icon slot="start" name="create" aria-hidden="true" />
      {{ 'trackplay.action.edit' | translate }}
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
