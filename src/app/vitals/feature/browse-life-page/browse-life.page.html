<app-page-header label="page-title.vitals-browse-life" hideButtons="true" />

<ion-content>
  <app-page-return route="/vitals/browse" label="page-title.vitals-browse" />

  <div class="brl sr-scanlines">
    <p class="brl-note">{{ 'vitals.iching.life-reduced' | translate }}</p>

    <ol class="brl-list" data-testid="vitals-browse-life-list">
      @for (entry of numbers; track entry.number) {
        <li class="brl-row sr-panel sr-corners">
          <span class="brl-row__number">{{ entry.number }}</span>
          <span class="brl-row__text">
            <span class="brl-row__name">{{ entry.nameKey | translate }}</span>
            <span class="brl-row__trait">{{ entry.traitKey | translate }}</span>
          </span>
        </li>
      }
    </ol>
  </div>
</ion-content>
