<app-list-page
  class="ion-page"
  [heading]="facade.heading()"
  [itemTemplate]="readingRow"
>
  <ion-button
    headerEnd
    slot="end"
    fill="clear"
    data-testid="vitals-pills-link"
    [routerLink]="'/vitals/profile/' + (facade.profile()?.id ?? '') + '/pills'"
    [attr.aria-label]="'vitals.a11y.pills' | translate"
  >
    <ion-icon slot="icon-only" name="medkit-outline" aria-hidden="true" />
  </ion-button>

  <ion-button
    headerEnd
    slot="end"
    fill="clear"
    data-testid="vitals-zodiac-link"
    [routerLink]="'/vitals/profile/' + (facade.profile()?.id ?? '') + '/zodiac'"
    [attr.aria-label]="'vitals.a11y.zodiac' | translate"
  >
    <ion-icon slot="icon-only" name="planet-outline" aria-hidden="true" />
  </ion-button>

  <ion-button
    headerEnd
    slot="end"
    fill="clear"
    data-testid="vitals-iching-link"
    [routerLink]="'/vitals/profile/' + (facade.profile()?.id ?? '') + '/iching'"
    [attr.aria-label]="'vitals.a11y.iching' | translate"
  >
    <ion-icon slot="icon-only" name="layers-outline" aria-hidden="true" />
  </ion-button>

  @if (canPickFavorite()) {
    <ion-button
      headerEnd
      slot="end"
      fill="clear"
      data-testid="vitals-favorite-toggle"
      [attr.aria-label]="'vitals.a11y.favorite' | translate"
      (click)="markFavorite()"
    >
      <ion-icon
        slot="icon-only"
        aria-hidden="true"
        [name]="isFavorite() ? 'star' : 'star-outline'"
      />
    </ion-button>
  }

  <ion-button
    headerEnd
    slot="end"
    fill="clear"
    [attr.aria-label]="'a11y.edit' | translate"
    (click)="facade.showEditProfileDialog()"
  >
    <ion-icon slot="icon-only" name="create-outline" aria-hidden="true" />
  </ion-button>

  <div beforeList>
    @let delta = facade.summary().deltaGrams;
    @if (delta !== undefined) {
      <p class="sr-hud ion-padding-horizontal">
        {{ 'vitals.label.change' | translate }} {{ delta | kg: true }}
      </p>
    }
    @defer (when facade.hasTrend()) {
      <app-weight-chart />
    }
  </div>
</app-list-page>

<ng-template #readingRow let-item let-ionList="ionList">
  <app-list-item
    [item]="item"
    [title]="item.grams | kg"
    [ionList]="ionList"
    [startSwipeAction]="editSwipeAction"
    (selectItem)="openReadingEdit(item)"
    (startSwipe)="openReadingEdit(item)"
    (deleteItem)="deleteReading(item)"
  >
    <p itemDetails class="second-line">
      <ion-note>{{ item.name | date }}</ion-note>
    </p>
  </app-list-item>
</ng-template>

<app-edit-reading-dialog />
<app-edit-profile-dialog />
