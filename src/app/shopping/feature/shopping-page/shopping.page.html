<app-grocery-list-page
  class="ion-page"
  listId="_shopping"
  pageHeader="{{ 'grocery.page-title.shopping' | translate }}"
  listHeader="{{ 'grocery.list-header.shopping' | translate }}"
  [itemTemplate]="shoppingItem"
>
  <ion-buttons slot="end" listActions>
    <ion-button [hidden]="!rxState().items.length" (click)="openActionSheet()">
      <ion-icon name="bag-add" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-buttons>
  @if (showScanButton) {
    <ion-button (click)="scan()" toolbarActions>
      <ion-icon slot="icon-only" name="barcode-outline" />
    </ion-button>
  }
</app-grocery-list-page>

<ng-template #shoppingItem let-item let-ionList="ionList">
  <app-list-item
    [item]="item"
    [title]="item.quantity + ' x ' + item.name"
    [ionList]="ionList"
    [crossedOut]="item.state === 'bought'"
    [showQuantityActions]="true"
    [showCartAction]="true"
    (selectItem)="showEditDialog(item)"
    (deleteItem)="removeItem(item)"
    (increment)="changeQuantity(item, +1)"
    (decrement)="changeQuantity(item, -1)"
    (cartItem)="buyItem(item)"
  ></app-list-item>
</ng-template>

<app-edit-shopping-item-dialog></app-edit-shopping-item-dialog>
<app-edit-global-item-dialog></app-edit-global-item-dialog>
<app-shopping-action-sheet></app-shopping-action-sheet>
