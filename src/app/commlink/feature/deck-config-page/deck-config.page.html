<app-page-header
  icon="settings-outline"
  [label]="'page-title.deck-config' | translate"
  hideButtons="true"
/>

<ion-content class="ion-padding">
  <ion-note>{{ 'deck.config.intro' | translate }}</ion-note>

  <ion-list lines="full">
    <ion-list-header>{{ 'deck.config.entries' | translate }}</ion-list-header>
    <ion-reorder-group
      [disabled]="false"
      (ionReorderEnd)="reorder($any($event))"
    >
      @for (entry of entries(); track entry.id) {
        <ion-item data-testid="deck-config-row">
          <ion-reorder slot="start" />
          <ion-label>
            <h2>{{ entry.nameKey | translate }}</h2>
            <p>{{ entry.titleKey | translate }}</p>
            @if (entry.moduleKey) {
              <p class="deck-config__module">
                {{ entry.moduleKey | translate }}
              </p>
            }
          </ion-label>
          <ion-toggle
            slot="end"
            [attr.aria-label]="entry.titleKey | translate"
            [checked]="!entry.hidden"
            (ionChange)="toggleEntry(entry.id)"
            data-testid="deck-config-row-toggle"
          />
        </ion-item>
      }
    </ion-reorder-group>
  </ion-list>

  <ion-button
    expand="block"
    fill="outline"
    class="ion-margin-top"
    [disabled]="!hasCustomConfig()"
    (click)="reset()"
  >
    {{ 'deck.config.reset' | translate }}
  </ion-button>
</ion-content>
