<ion-list-header>
  <ion-label class="sr-hud" [id]="labelId()">{{
    labelKey() | translate
  }}</ion-label>
</ion-list-header>
<ion-item lines="none">
  <ion-segment
    [value]="value()"
    [attr.aria-labelledby]="labelId()"
    (ionChange)="pick($event)"
  >
    <ng-content />
  </ion-segment>
</ion-item>
