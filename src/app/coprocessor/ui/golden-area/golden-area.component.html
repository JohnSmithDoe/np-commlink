<svg
  class="area"
  role="group"
  preserveAspectRatio="xMidYMid meet"
  data-testid="coprocessor-golden-area"
  [attr.viewBox]="viewBox()"
  [attr.aria-label]="label()"
>
  <rect
    class="area__wall"
    x="0"
    y="0"
    [attr.width]="width()"
    [attr.height]="height()"
  />

  @for (square of plan().squares; track $index) {
    <rect
      class="area__square"
      [attr.x]="square.x"
      [attr.y]="square.y"
      [attr.width]="square.size"
      [attr.height]="square.size"
    />
  }

  <path class="area__spiral" [attr.d]="plan().path" />

  @for (guide of across(); track guide.value) {
    <line
      class="area__guide"
      y1="0"
      [class.area__guide--deep]="guide.level > 1"
      [attr.x1]="guide.value"
      [attr.x2]="guide.value"
      [attr.y2]="height()"
    />
  }

  @for (guide of down(); track guide.value) {
    <line
      class="area__guide"
      x1="0"
      [class.area__guide--deep]="guide.level > 1"
      [attr.y1]="guide.value"
      [attr.y2]="guide.value"
      [attr.x2]="width()"
    />
  }

  @for (point of targets(); track point.id) {
    <circle
      class="area__point"
      role="button"
      tabindex="0"
      data-testid="coprocessor-golden-point"
      [class.area__point--chosen]="point.id === selected()"
      [attr.cx]="point.x"
      [attr.cy]="point.y"
      [attr.r]="point.radius"
      [attr.stroke-width]="markerSize()"
      [attr.aria-label]="pointLabel()"
      [attr.aria-pressed]="point.id === selected()"
      (click)="pick.emit(point.id)"
      (keydown.enter)="pick.emit(point.id)"
      (keydown.space)="pick.emit(point.id)"
    />
  }
</svg>
