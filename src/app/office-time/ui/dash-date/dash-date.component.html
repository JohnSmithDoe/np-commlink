@let today = data();
<ion-card>
  @if (title()) {
    <ion-card-header>
      <ion-card-title>{{ title() }}</ion-card-title>
    </ion-card-header>
  }
  <ion-card-content>
    <p class="week">{{ 'dash-date.week' | translate }} {{ today.week }}</p>
    <p class="day">
      {{ today.day }},<br />
      <span class="date">{{ today.date }}</span>
    </p>
    <p class="time">{{ time() }}</p>
  </ion-card-content>
</ion-card>
