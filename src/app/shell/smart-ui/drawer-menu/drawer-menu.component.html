<ion-header>
  <ion-toolbar>
    <ion-title>{{ wordmark }}</ion-title>
    <ion-buttons slot="end">
      <ion-menu-toggle [autoHide]="false">
        <ion-button
          routerLink="/handbook"
          [attr.aria-label]="'page-title.handbook' | translate"
        >
          <ion-icon slot="icon-only" name="book-outline" aria-hidden="true" />
        </ion-button>
      </ion-menu-toggle>
      <ion-menu-toggle [autoHide]="false">
        <ion-button
          routerLink="/settings"
          [attr.aria-label]="'page-title.settings' | translate"
        >
          <ion-icon
            slot="icon-only"
            name="settings-outline"
            aria-hidden="true"
          />
        </ion-button>
      </ion-menu-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <nav>
    <ion-list>
      @for (entry of menuEntries(); track entry.id) {
        <ion-menu-toggle [autoHide]="false">
          <ion-item
            lines="none"
            data-testid="menu-row"
            [button]="true"
            [routerLink]="entry.route"
          >
            <ion-icon slot="start" aria-hidden="true" [name]="entry.icon" />
            <ion-label>{{ entry.nameKey | translate }}</ion-label>
            @let badge = menuBadge(entry);
            @if (badge > 0) {
              <ion-badge slot="end" [color]="menuBadgeColor(entry)">{{
                badge
              }}</ion-badge>
            }
          </ion-item>
        </ion-menu-toggle>
      }
    </ion-list>
  </nav>
</ion-content>
