<!doctype html>
<!-- ─── why ─────────────────────────────────────────────────────────
     Everything below that could be argued is argued in docs/footguns.md
     — the splash and its `reveal()`, the `<noscript>` gate that hides it
     when nothing will ever call that, and the np mark drawn here as well
     as in public/np-logo.svg. What is left is three hand-kept mirrors,
     and a mirror is the one thing this document cannot enforce:

     · `lang` and `data-theme` copy the defaults their services seed
       (bootLanguage, theme.service), so the shell paints and reads
       correctly before Angular boots; `settings` overwrites both on
       hydrate.
     · `theme-color` and the two `#app-splash` background/colour pairs
       are literal copies of a theme's `--sr-bg`/`--sr-text`
       (_shadowrun.scss) — one pair per theme, chosen off the OS
       preference because that is a guess at the theme and the only
       signal this early. Measured, not assumed: the builder inlines
       only the base `:root` as critical CSS, so before the async
       stylesheet lands `var(--sr-bg)` is the PLAIN backdrop and
       `Canvas` is white — both wrong for the cyberpunk default, which
       is the flash the splash exists to prevent. Neither derivation
       works; these stay in sync by hand.
     · the German `description` is the one string no bundle can serve: a
       crawler and the install prompt read it before any app code runs.
       manifest.webmanifest carries the same copy, for the same reason.
     ───────────────────────────────────────────────────────────────── -->
<html lang="de" data-theme="cyberpunk">
  <head>
    <meta charset="utf-8" />
    <title>np-commlink</title>

    <base href="/" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f141b" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Persönliches Cyberdeck: Zeiterfassung, Vorräte, Einkaufslisten, Rezepte, Aufgaben, Finanzen und Spielstände in einer App."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192x192.png"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="manifest.webmanifest" />

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f141b;
        color: #dfe4ea;
        transition: opacity 300ms ease;
      }
      @media (prefers-color-scheme: light) {
        #app-splash {
          background: #f4f6f8;
          color: #1f2733;
        }
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash__logo {
        width: 80px;
        height: 80px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-splash__logo {
          animation: app-splash-pulse 1.6s ease-in-out infinite;
        }
      }
      @keyframes app-splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
    </style>

    <noscript>
      <style>
        #app-splash {
          display: none;
        }
      </style>
    </noscript>
  </head>

  <body>
    <app-root></app-root>
    <div id="app-splash" aria-hidden="true">
      <svg class="app-splash__logo" viewBox="0 0 64 64" fill="none">
        <path
          d="M21 24L14 17H10.5M21 24V14M21 24L28 17"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle
          cx="8.5"
          cy="17"
          r="2"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle
          cx="21"
          cy="12"
          r="2"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle
          cx="29.4"
          cy="15.6"
          r="2"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="M21 44V24M21 32A6 6 0 0 1 33 32V44"
          stroke="currentColor"
          stroke-width="2.5"
        />
        <path d="M43 26V54" stroke="currentColor" stroke-width="5.5" />
        <circle
          cx="51"
          cy="35"
          r="6.25"
          stroke="currentColor"
          stroke-width="5.5"
        />
      </svg>
    </div>
    <noscript
      >Bitte aktiviere JavaScript, um diese Anwendung zu nutzen. — Please enable
      JavaScript to continue using this application.</noscript
    >
  </body>
</html>
