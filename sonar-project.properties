sonar.projectKey=np-commlink
sonar.projectName=np-commlink
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.spec.ts,e2e/**/*
sonar.exclusions=public/i18n/**,src/**/*.spec.ts,e2e/**/*
sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.app.json,tsconfig.spec.json
sonar.javascript.lcov.reportPaths=coverage/np-commlink/lcov.info

sonar.scm.provider=git

# Two analyzer blind spots, suppressed in the repo rather than in a server-side
# quality profile so the reasoning travels with the code.
sonar.issue.ignore.multicriteria=ionicRowClick,sassUseBeforeImport

# The generic HTML analyzer sees `(click)` on a custom element and assumes it is
# unreachable by keyboard. Ionic renders ion-button / ion-item[button] /
# ion-item-option as real focusable buttons, so Enter and Space already work.
sonar.issue.ignore.multicriteria.ionicRowClick.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.ionicRowClick.resourceKey=src/app/**/*.html

# Sass requires every `@use` to precede all other statements, so the Ionic CSS
# `@import`s below them cannot be hoisted.
sonar.issue.ignore.multicriteria.sassUseBeforeImport.ruleKey=css:S8778
sonar.issue.ignore.multicriteria.sassUseBeforeImport.resourceKey=src/global.scss
