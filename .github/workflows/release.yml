# Publishing only. Every gate this file used to run lives in `verify-all.sh`,
# which lefthook runs on pre-push — so a tag arrives already verified, and
# re-running the suite here would re-answer a question nobody asked twice. What
# is left is the work a laptop cannot do: deploy Pages from a trusted
# environment, and open the release draft.
#
# Five things this file cannot say in YAML:
#   - The trigger is `v*`, not the semver glob, so the `vMAJOR.MINOR.PATCH` shape
#     is asserted in ONE place — the shell regex in `version`. A pre-release tag
#     reaches that job and is answered with a notice.
#   - `version` is its own job so the tag is judged before a runner installs
#     anything. A job whose `needs:` was skipped is skipped too, which is what
#     carries that one answer down the chain without repeating the condition.
#   - `deploy` and `release` are separate jobs to keep their tokens separate:
#     each holds the one write scope it needs and no other job holds any. The
#     draft hangs off `build` rather than off `version` so a failed build leaves
#     no release to delete by hand.
#   - Publishing a tag also needs a repo setting: github-pages → Deployment
#     branches and tags → Ref type **Tag**, pattern `v*`. A branch rule, which is
#     the default, does not cover tags. See README's Deployment section.
#   - setup-node's `cache: pnpm` is unused: it runs before corepack has made pnpm
#     exist. Hence the explicit cache step.
name: Release

on:
  push:
    tags: ['v*']

# Never cancel: a superseded run here is one that may be mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Naming any scope sets every unnamed one to none. deploy and release add theirs.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # The tag must AGREE with package.json, because nothing downstream reads the
  # tag: versionName and versionCode come from package.json (android-postsync.sh
  # patch 4) and NPC_RELEASE from $npm_package_version. A tag that ran ahead
  # would publish v1.0.1 carrying an APK that still claims versionCode 10000,
  # which Android refuses to install over its predecessor — and the only way in
  # is an uninstall, taking every tracked session, the pantry and the ledger with
  # it. Silent at build time.
  #
  # GITHUB_REF reaches the script through env, never spliced as ${{ }} —
  # interpolation is textual substitution before a shell sees it, which makes the
  # value code rather than data.
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Release version?
        id: release
        env:
          REF: ${{ github.ref }}
        run: |
          version="${REF#refs/tags/}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$version is not a release version — nothing published."
            exit 0
          fi
          declared="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $version disagrees with package.json ($declared) — the APK derives its identity from package.json, not from the tag."
            exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Corepack reads the pinned version from package.json's packageManager.
      - name: Activate pnpm
        run: corepack enable pnpm

      - uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      # Not `build`: Capacitor wants a relative base href, a subpath deploy the
      # absolute one. `verify:pages` — which serves this output from its subpath
      # — is a pre-push gate, so what runs here is the build alone.
      - name: Production build (Pages base href)
        run: pnpm run build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout and no download: deploy-pages finds the artifact by name
      # within this workflow run, which `needs:` is what guarantees exists.
      - id: deployment
        uses: actions/deploy-pages@v5

  # A DRAFT, and it stays one until a human attaches the APK. This takes a
  # release exactly as far as it can go without the signing key — tag, title, the
  # notes a user needs — and stops at the boundary, because the key is
  # deliberately on one machine and not on a runner (README, "Release signing").
  # The two assets `pnpm run apk:signed` produces are attached in the web UI.
  #
  # `contents: write` exists in this job and nowhere else; deploy authenticates
  # to Pages with a short-lived OIDC token instead. No checkout either — gh
  # addresses the repository through GH_REPO.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Edit-or-create rather than create: `gh release create` fails outright on
      # a tag that already has a release, so a re-run of a failed job would need
      # a manual delete first. `--draft` is re-asserted on that path too — a
      # re-run can then never publish a release nobody has attached an APK to.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Breaking

          - **BIOMON clears the records left from before SIN** — the weights and medicines that
            belonged to the old BIOMON profiles, hidden since the last release, are removed the first
            time you open BIOMON.

          ## New

          - **SIN · Add someone without leaving the page** — the add button in BIOMON and TRACKPLAY
            now opens the person form right where you are, instead of sending you to SIN.
          - **SIN · Removing someone tidies up after them** — when you delete a person, their
            weights, medicines, star signs and games go with them.
          - **BIOMON · When does the Age of Aquarius begin?** — the zodiac page now shows what eight
            schools answer, from 1962 to 3573, how each one counts, and which one the page itself uses.
          - **SIMSENSE · Your folders open at once** — a folder is read when you add it or ask for a
            rescan, not on every visit. A song that has gone missing is skipped, and a folder the app
            lost access to says so.
          - **A page that breaks stays contained** — if one screen fails to show, it alone offers a
            retry, and the rest of the app keeps working.
          - **Handbook · SIN and SIMSENSE explained** — two new handbook pages, and every figure in
            the handbook shows the app as it looks today.

          ## Fixed

          - **SIMSENSE · Seeking and albums** — the position knob stays where you drag it, and an
            album with guest artists stays one album instead of splitting per "feat." credit.
          - **TRACKPLAY · SOYKAF · Editing a played game or a saved recipe** — the edit form opens and
            closes properly again.
          - **SIN · A fresh form every time** — adding someone from BIOMON or TRACKPLAY no longer fills
            in whatever you last searched for in SIN.
          - **AGENDA · Recurring tasks behave** — changing a task's rhythm plans the next date from
            today instead of making it look overdue; closing a task from its form moves it on and logs
            it, just like ticking it in the list; a task you add from search gets your default
            settings; a long-neglected task catches up to a date after today; and a task due today
            warns you that day rather than turning red at midnight.
          - **BIOMON · Pill reminders stay on** — they could switch themselves off when the app
            started. The weight calculator also refuses a result of zero or less.
          - **CREDSTICK · Bank imports you can trust** — a pending booking is no longer imported a
            second time once the bank books it; umlauts survive a file with mixed text encodings; and
            an amount finer than a cent is refused instead of quietly rounded.
          - **CREDSTICK · Rules, schedules and the burndown** — a rule's amount no longer grows a
            hundredfold when saved in English; a refund no longer flips a schedule to income, and a
            schedule's next date follows your actual payments; a cash spend finds its bank booking
            within three calendar days; and spends from accounts you excluded no longer eat into the
            allowance.
          - **COMMS · The unread count** — it counts again after an update.
          - **Every program's tabs fit** — tab bars show icons only, so five tabs fit a phone screen;
            each keeps its name for screen readers.
          - **Easier to read** — dimmed text keeps its contrast in both looks, and the SYSOP colour
            pickers match the app's style.

          ## Faster

          - **AGENDA · Old recurring tasks catch up at once** — however many dates a task missed, its
            next one is worked out in a single step.
          - **SIGIL · A lighter notes list** — the list shows small previews of your pictures instead
            of loading every full-size image.

          ---

          **Android APK** — `np-commlink.apk`, signed with the release key.

          Android will ask you to allow installs from whatever app you open it from. The web app needs
          no install at all: <https://johnsmithdoe.github.io/np-commlink/>

          Two checks are worth running first, both against values published here and in the README
          rather than against anything the APK says about itself:

          ```sh
          sha256sum np-commlink.apk
          apksigner verify --print-certs np-commlink.apk
          ```

          The signer SHA-256 must match the fingerprint pinned in the README. It is stable for the life
          of the app, so checking it once detects any later key swap.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
          fi
