name: CI

# Run the full gate suite on every PR and on pushes to main. This is a
# *verification* pipeline only — no build artifacts are published and no
# deploy happens, so it needs no secrets/environments (those are a separate
# product decision, see docs/todo.md item 4).
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run — don't burn
# minutes verifying a commit that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, cheap gates: types, module boundaries, lint, unit tests, prod build.
  # Kept in one job because they share the same install and run in seconds.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the pinned version from package.json's
      # `packageManager` field (pnpm@11.9.0) — one source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is stale — CI must build the
      # exact dependency graph the lockfile pins, never silently resolve newer.
      - run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm exec eslint "src/**/*.{ts,html}"

      # Prettier is enforced by the lefthook pre-commit hook, which a
      # --no-verify commit skips — so CI is the gate that actually holds.
      - name: Format (prettier)
        run: pnpm run format:check

      - name: Module boundaries (sheriff)
        run: pnpm exec sheriff verify src/main.ts

      # esbuild (build/test) transpiles without a full type-check, so tsc is a
      # required, separate gate — it catches type-only breakage the others miss.
      - name: Type-check (app)
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

      - name: Type-check (spec)
        run: pnpm exec tsc -p tsconfig.spec.json --noEmit

      # Coverage rather than a bare run: the thresholds in vitest.config.ts are
      # a regression floor, and they only bind if something checks them.
      - name: Unit tests (vitest)
        run: pnpm run test:coverage

      - name: Production build
        run: pnpm run build

  # End-to-end lives in its own job: it needs the Chromium download + system
  # deps and drives a real dev server, so it's slower and runs in parallel with
  # `verify` for faster overall feedback. Playwright's webServer starts
  # `ng serve` itself; CI mode (retries/1-worker/github reporter) auto-engages
  # from the GITHUB_ACTIONS-provided CI=true.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium + OS deps
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (playwright)
        run: pnpm run e2e

      # Keep the HTML report + traces on failure so a red run is debuggable.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
